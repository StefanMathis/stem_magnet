[package]
name = "stem_magnet"
version = "0.6.0"
edition = "2024"
description = "Permanent magnet definition for stem - a Simulation Toolbox for Electric Motors."
readme = "README.md"
license  = "MIT OR Apache-2.0"
repository = "https://github.com/StefanMathis/stem_magnet.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
compare_variables = { version = "0.3.0", features = ["proc_macro"] }
planar_geo = { version = "0.6.2" }
rayon = "1"
serde_mosaic = { version = "0.3", optional = true }
deserialize_untagged_verbose_error = { version = "0.1.8", optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
stem_material = { version = "0.5.0" } 
dyn-clone = "1"
typetag = { version = "^0.2", optional = true }
embed-doc-image = { version = "0.1.4", optional = true }

[features]
default = []
serde = ["dep:serde_mosaic", "dep:deserialize_untagged_verbose_error", "dep:serde", "dep:typetag", "stem_material/serde"]
cairo = ["planar_geo/cairo"]
doc-images = ["dep:embed-doc-image"]

[dev-dependencies]
approxim = { version = "0.6" }
indoc = "1.0"
serde_yaml = "0.8"
serde_mosaic = { version = "0.3", features = ["serde_yaml"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
cairo_viewport = { version = "0.3", features = ["image-compare"] }

[package.metadata.docs.rs]
features = ["serde", "cairo", "doc-images"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "create_and_draw_arc_parallel_magnets"
required-features = ["cairo"]

[[example]]
name = "create_and_draw_arc_segment_magnets"
required-features = ["cairo"]

[[example]]
name = "plot_readme_magnets"
required-features = ["cairo"]